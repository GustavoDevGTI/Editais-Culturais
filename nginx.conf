server {
    listen 8080;
    listen [::]:8080;
    server_name editaisculturais.amargosa.ba.gov.br/;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/pdf
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;
}

